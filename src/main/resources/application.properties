spring.application.name=hourlyhire
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

logging.pattern.level=%5p [correlationId:%X{correlationId:-N/A}]

springdoc.swagger-ui.tagsSorter=alpha


# -----------------------------------------------
# Flyway schema migrations
# -----------------------------------------------
spring.flyway.enabled=false

# -----------------------------------------------
# Kafka (notification module)
# -----------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=hourlyhire-notification
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topics.notification-events=notification.events
app.kafka.topics.notification-events-dlt=notification.events.dlt
app.kafka.topics.partitions=3
app.kafka.topics.replicas=1

# Notification module
app.notification.mail-from=${MAIL_FROM:no-reply@hourlyhire.local}